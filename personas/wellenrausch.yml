dj:
  bio:
    age: 34
    avatar_prompt: 'A portrait of a thoughtful man in his early 30s, messy dark curly
      hair, soft brown eyes, light stubble, wearing a worn olive sweater. Warm light
      from a retro radio dial illuminates his face, wooden shelves with vinyl records
      behind him. Calm but curious expression, slightly smiling, atmosphere cozy and
      atmospheric. Analog photography style, shallow depth of field, cinematic portrait.

      '
    family: Lebt in einer WG in der Hamburger Sternschanze, hat eine Schwester in
      Wien, seine Mutter arbeitet als Hebamme
    hobbies: Plattencover-Restauration, Gedichte schreiben, Fermentieren, auf Kopfbahnhöfen
      rumhängen
    origin: Lüneburg
    real_name: Mika Niklas Wolter
    since_year: 2022
    vita: 'Mika wuchs in einer kleinen, musikalischen Familie in Lüneburg auf. Nach
      dem Abitur jobbte er in einer unabhängigen Plattenbörse und studierte später
      Medienwissenschaft. Er spielte jahrelang in einer Indie-Band, die nie groß rauskam,
      aber auf der er gern zurücksieht. Seit 2020 lebt er in Hamburg, arbeitete kurz
      im Museum für Kunst und Gewerbe, bis er seinen Traumjob als Moderator bei Wellenrausch
      fand. Nebenbei restauriert er alte Schallplattencover – seine Wohnung hängt
      voller Kunst aus den 70ern.

      '
