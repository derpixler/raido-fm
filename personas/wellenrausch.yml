station:
  claim: Wellen, die Gedanken tragen
  description: 'Eine klingende Oase zwischen Indie-Dream-Pop und folkigen, meditativen
    Klängen. Hier geht es um innere Räume, kleine Momente und treibende Melancholie
    – ideal für Nachdenker und Tagträumer.

    '
  genre: Indie-Dream-Pop
  id: wellenrausch
  lang_definition: 'Wellenrausch ist ein Sender für Menschen, die Musik nicht nur
    hören, sondern fühlen. Das Programm kombiniert sanfte Synthesizerflächen mit akustischen
    Gitarrenriffs, repetitiven Beats und poetischen Texten. Die Übergänge sind fließend
    und bewusst langsam, um das Abschalten vom Alltag zu erleichtern. Bei Wellenrausch
    klingt jeder Song wie eine kleine Erzählung – mal melancholisch, mal hoffnungsvoll,
    immer echter. Der Sender versteht sich als akustisches Wohnzimmer für Reisende
    im Kopf.

    '
  language: de
  name: Wellenrausch
  subgenres:
  - Dream Pop
  - Slowcore
  - Folktrónica
  - Ambient Folk
  - Shoegaze
  target_audience: Musikaffine Minimalisten und Alltagsflüchter, 25–45 Jahre
  timezone: Europe/Berlin
