station:
  claim: Waldhoeren fuer die Seele
  description: 'Klaengelaub verbindet organische Feldaufnahmen mit tiefen Ambient-Klaengen
    und entschleunigter Electronica. Der Sender ist ein auditiver Mikrokosmos, der
    die Grenzen zwischen Natur und Studio verschwimmen laesst.

    '
  genre: Ambient
  id: klaengelaub
  lang_definition: 'Klaengelaub ist eine Radiostation, die sich der akustischen Erkundung
    von Naturraeumen widmet. Das Programm verschmilzt Field Recordings aus deutschen
    Waeldern und Mooren mit sanften, elektronischen Texturen und reduzierten Klanginstallationen.
    Wir definieren Entschleunigung neu, indem wir mikroskopische Geraeusche wie fallende
    Tannennadeln oder knirschenden Frost mit synthetischen Pads und spaerlichen Rhythmen
    ueberlagern. Die Musik kann von apokalyptischer Stille bis zu organischem Pulsieren
    reichen, bleibt aber immer erdig und authentisch. Unser Ziel ist es, dem Hoerer
    einen Raum zu schaffen, in dem er die Zeit vergessen kann - fernab von urbaner
    Hektik, tief in der Klangmatte des Unterholzes.

    '
  language: de
  name: Klaengelaub
  subgenres:
  - Field Recording
  - Nature Electronica
  - Drone
  - Slow Techno
  - Organic House
  target_audience: Entschleuniger, Naturenthusiasten, meditative Hoerer und Fans von
    Björk's Biophilia oder Max Richter.
  timezone: Europe/Berlin
