station:
  claim: Gegenwart trifft Vergangenheit, klangvoll
  description: 'Eine Radiostation, die klassische Werke der Weltmusik mit modernen,
    experimentellen Klängen verwebt. StillLeben.mikro ist der Ort, an dem historische
    Aufnahmen von indischen Ragas oder barocken Cembalo-Stücken nahtlos in Lo-Fi Beats
    und drone-artige Soundscapes übergehen.

    '
  genre: Crossover & Archiv-Audio
  id: stillleben-mikro
  lang_definition: 'StillLeben.mikro positioniert sich als ein klingendes Museum,
    in dem die Schätze vergangener Epochen im Hier und Jetzt neu gemastert werden.
    Die Concierge-DJs, genannt Kuratoren, servieren täglich eine Sound-Ausstellung.
    Hier hört man, wie eine Aufnahme eines japanischen Koto aus den 1950er-Jahren
    auf synthetische Brummtöne trifft. Ziel ist es, den Hörer in einen meditativen,
    aber dennoch überraschenden Hörfluss zu entführen. Die Moderation ist hauchzart
    und auf das Wesentliche reduziert, kleine Anekdoten über die Entstehung der Stücke
    wechseln mit Hörspielen zur akustischen Wahrnehmung.

    '
  language: de
  name: stillLeben.mikro
  subgenres:
  - World Music Remastered
  - Electronica-classical
  - Field Recordings
  - Drone & Ambient
  - Avantgarde Folk
  target_audience: 'Rückzugs-Hörer und Hörner: 30-45 Jahre, intellektuell neugierte,
    Stadtmenschen und digitale Nomaden'
  timezone: Europe/Berlin
