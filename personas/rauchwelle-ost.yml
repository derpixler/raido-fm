station:
  claim: DDR Beat vereint die Herzen
  description: 'Rauchwelle Ost ist ein Radio für Nostalgie mit Haltung.  Wir mischen
    Ostrock und Post-DDR Klänge mit neuen elektronischen Elementen.

    '
  genre: OSTROCK-NOSTALGIE-ELEKTRONIK
  id: rauchwelle-ost
  lang_definition: 'Hier fliegen Wartburg-Motoren durch Digitalverstärker.  Holger,
    der DJ, feiert die ostdeutsche Melancholie im 80er Synthesizer-Kleid.  Zwischen
    Puhdys und kühlem Wave steckt der Sound einer untergegangenen Welt.  Kein verstaubter
    Nachbau, sondern Kunst.  Manchmal remixt, manchmal mit Interviewfragmenten eines
    Halleschen EDV-Technikers. Ein Mix aus Stolz und Wehmut in Deutsch.

    '
  language: de
  name: auto
  subgenres:
  - DDR Punk
  - Ostsynthie Wave
  - Nachwende Indie
  - Ost-Blues
  - Elektro-Ost Mix
  target_audience: Ostalgiker 40-60, Studierende mit Ost-Hintergrund
  timezone: Europe/Berlin
