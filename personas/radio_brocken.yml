station:
  claim: Brummend durch die Nacht
  description: 'Der einzige Sender, der aus dem Inneren einer rasenden Toilette auf
    dem Beifahrersitz eines alten MAN-Sattelzuges sendet. Hier treffen ehrlicher Blues
    und derbe Schlager auf die Magie eines unsanierten Klos an der Raststätte, während
    der Moderator seine grüblerischen Gedanken vom Fahrersitz aus mit der Welt teilt.

    '
