services:
  station:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8080}
      - PERSONA_PATH=${PERSONA_PATH:-persona.yml}
      - TIME_SCALE=${TIME_SCALE:-60}
  cuntry:
    build: .
    ports:
      - "8082:8082"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=8082
      - PERSONA_PATH=persona.techno.example.yml
      - TIME_SCALE=60
