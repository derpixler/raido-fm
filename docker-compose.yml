services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: raido-docker-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - POST=1
    expose:
      - "2375"

  hub:
    build: ./hub
    ports:
      - "127.0.0.1:${HUB_PORT:-80}:${HUB_PORT:-80}"
    volumes:
      - ./hub/data:/app/data
      - ./personas:/app/personas
      - ./contributors.yml:/app/contributors.yml
    env_file:
      - .env
    environment:
      - HUB_PORT=${HUB_PORT:-80}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-change-me-to-a-strong-random-token}
      - STATION_IMAGE=raido-station:latest
      - MAX_INPUT_CHARS=${MAX_INPUT_CHARS:-500}
      - PERSONAS_HOST_PATH=${PWD}/personas
      - STATIONS_DATA_HOST_PATH=${PWD}/stations-data
      - DOCKER_HOST=tcp://docker-proxy:2375
    depends_on:
      docker-proxy:
        condition: service_started
      station-default:
        condition: service_started

  station-default:
    build: ./station
    image: raido-station:latest
    ports:
      - "8080:8080"
    volumes:
      - ./station/data:/app/data
      - ./personas:/app/personas:ro
      - ./contributors.yml:/app/contributors.yml:ro
    env_file:
      - .env
    environment:
      - PORT=8080
      - PERSONA_PATH=/app/personas/default.yml
      - TIME_SCALE=${TIME_SCALE:-60}
      - MAX_INPUT_CHARS=${MAX_INPUT_CHARS:-500}
      - HUB_URL=http://hub:${HUB_PORT:-80}
      - HUB_ADMIN_TOKEN=${ADMIN_TOKEN:-change-me-to-a-strong-random-token}
    labels:
      - "raido.role=station"
      - "raido.station.id=default"
      - "raido.station.slug=default"
      - "raido.station.port=8080"
      - "raido.station.protected=true"
